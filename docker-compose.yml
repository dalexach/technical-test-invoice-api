# Levanta SQL Server y aplica database/schema.sql automaticamente.
#
#   cp .env.example .env
#   docker compose up -d
#
# En Apple Silicon la imagen oficial de SQL Server corre emulada (linux/amd64),
# por lo que el primer arranque tarda algunos minutos.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invoice-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # Contenedor efimero: aplica el esquema y termina.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invoice-db-init
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Aplicando database/schema.sql..."
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /scripts/schema.sql
        echo "Cargando datos de ejemplo..."
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /scripts/seed.sql
        echo "Base de datos lista."
    restart: "no"

volumes:
  sqlserver-data:
